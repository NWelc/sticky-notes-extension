<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 10px;
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      width: 180px;
    }
    button {
      width: 100%;
      padding: 8px 12px;
      font-size: 14px;
      background: #fff9a3;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #f5f0a0; }
    button:focus-visible { outline: 2px solid #3b82d4; }
  </style>
</head>
<body>
  <button id="add" aria-label="Add a new sticky note to this page">＋ Add Sticky Note</button>
  <script src="popup.js"></script>
</body>
</html>
